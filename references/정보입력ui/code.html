</div>
</div>
<div class="px-container-padding py-stack-md flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="flex flex-col gap-unit">
<h1 class="font-headline-lg-mobile text-primary text-[28px]">매장에 대해 알려주세요</h1>

</div>

</button>

</button>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Category Selection Logic
    const categoryBtns = document.querySelectorAll('.category-btn');
    const categoryInput = document.getElementById('store-category');

    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // Reset all
        categoryBtns.forEach(b => {
          b.setAttribute('data-selected', 'false');
          b.classList.remove('border-vibrant-orange', 'bg-surface-container-lowest', 'ring-4', 'ring-vibrant-orange/20');
          b.classList.add('border-transparent', 'bg-surface-container');
          
          const icon = b.querySelector('.material-symbols-outlined');
          const text = b.querySelector('span:not(.material-symbols-outlined)');
          icon.classList.remove('text-vibrant-orange');
          icon.classList.add('text-primary');
          text.classList.remove('text-vibrant-orange');
          text.classList.add('text-primary');
        });

        // Set active
        btn.setAttribute('data-selected', 'true');
        btn.classList.remove('border-transparent', 'bg-surface-container');
        btn.classList.add('border-vibrant-orange', 'bg-surface-container-lowest', 'ring-4', 'ring-vibrant-orange/20');
        
        const icon = btn.querySelector('.material-symbols-outlined');
        const text = btn.querySelector('span:not(.material-symbols-outlined)');
        icon.classList.remove('text-primary');
        icon.classList.add('text-vibrant-orange');
        text.classList.remove('text-primary');
        text.classList.add('text-vibrant-orange');

        categoryInput.value = text.textContent.trim();
      });
    });

    // Image Upload Preview Logic (Mock)
    const fileInput = document.getElementById('image-upload');
    const container = document.getElementById('upload-preview-container');
    const prompt = document.getElementById('upload-prompt');
    const preview = document.getElementById('image-preview');
    const removeBtn = document.getElementById('remove-image-btn');

    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        // In a real app, use FileReader. Here we just mock it with a visual change.
        prompt.classList.add('hidden');
        preview.classList.remove('hidden');
        removeBtn.classList.remove('hidden');
        container.classList.remove('border-dashed', 'border-outline-variant');
        
        // Mock image loaded (using a solid color or gradient for demo since we can't load real file)
        preview.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="%23ffdbcd"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" fill="%23a33e00">Photo Uploaded</text></svg>';
      }
    });

    removeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation(); // Prevent triggering the file input click
      
      fileInput.value = '';
      prompt.classList.remove('hidden');
      preview.classList.add('hidden');
      removeBtn.classList.add('hidden');
      preview.src = '';
      container.classList.add('border-dashed', 'border-outline-variant');
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-vibrant-orange"><div class="flex justify-around items-center h-20 px-gutter"><a aria-current="page" class="flex flex-col items-center justify-center w-20 h-16 transition-all active:scale-95 text-vibrant-orange" data-path="home" href="#"><span class="material-symbols-outlined text-[32px]">storefront</span><span class="font-label-lg text-[12px]">홈</span></a><a class="flex flex-col items-center justify-center w-20 h-16 text-on-surface-variant transition-all active:scale-95 hover:text-primary" data-path="analysis" href="#"><span class="material-symbols-outlined text-[32px]">analytics</span><span class="font-label-lg text-[12px]">분석</span></a><a class="flex flex-col items-center justify-center w-20 h-16 text-on-surface-variant transition-all active:scale-95 hover:text-primary" data-path="history" href="#"><span class="material-symbols-outlined text-[32px]">history</span><span class="font-label-lg text-[12px]">이력</span></a><a class="flex flex-col items-center justify-center w-20 h-16 text-on-surface-variant transition-all active:scale-95 hover:text-primary" data-path="admin" href="#"><span class="material-symbols-outlined text-[32px]">admin_panel_settings</span><span class="font-label-lg text-[12px]">관리자</span></a></div></nav>
